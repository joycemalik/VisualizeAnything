<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datanaut.ai - Data Analytics</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      background: #ffffff;
      color: #000000;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 80px 40px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      font-weight: 300;
      color: #000000;
      margin-bottom: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 16px;
      color: #666666;
      margin-bottom: 80px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .upload-section {
      border: 2px solid #000000;
      padding: 60px 40px;
      margin-bottom: 60px;
      transition: all 0.2s ease;
    }

    .upload-section:hover {
      background: #f8f8f8;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      display: inline-block;
      padding: 16px 32px;
      font-size: 14px;
      font-weight: 400;
      color: #ffffff;
      background: #000000;
      border: 2px solid #000000;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: inherit;
    }

    .btn:hover {
      background: #ffffff;
      color: #000000;
    }

    .dataset-list {
      border: 1px solid #000000;
      padding: 40px;
      text-align: left;
      margin-top: 40px;
    }

    .dataset-list h2 {
      color: #000000;
      margin-bottom: 30px;
      font-size: 18px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #000000;
      padding-bottom: 10px;
    }

    .dataset-item {
      padding: 16px 0;
      border-bottom: 1px solid #e0e0e0;
      transition: all 0.2s ease;
    }

    .dataset-item:last-child {
      border-bottom: none;
    }

    .dataset-item:hover {
      background: #f8f8f8;
      padding-left: 16px;
    }

    .dataset-item a {
      text-decoration: none;
      color: #000000;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .dataset-item a:hover {
      text-decoration: underline;
    }

    .no-datasets {
      color: #666666;
      font-style: italic;
      text-align: center;
      padding: 40px 0;
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 20px;
      }
      
      h1 {
        font-size: 32px;
      }
      
      .upload-section {
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Datanaut</h1>
    <p class="subtitle">Data Analytics Platform</p>

    <!-- Upload Section -->
    <div class="upload-section">
      <form id="uploadForm" method="post" enctype="multipart/form-data" action="{% url 'upload_dataset' %}">
        {% csrf_token %}
        <input type="file" id="fileInput" name="file" accept=".csv,.xlsx,.json" onchange="document.getElementById('uploadForm').submit()">
        <label for="fileInput" class="btn">Upload Dataset</label>
      </form>
    </div>

    <!-- Dataset List -->
    <div class="dataset-list">
      <h2>Datasets</h2>
      {% if datasets %}
        {% for dataset in datasets %}
          <div class="dataset-item">
            <a href="{% url 'dataset_preview' dataset.id %}">
              {{ dataset.name }}
            </a>
          </div>
        {% endfor %}
      {% else %}
        <p class="no-datasets">No datasets uploaded yet.</p>
      {% endif %}
    </div>
  </div>
</body>
</html>
